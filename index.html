.editorial{position:relative}.editorial img{width:100%;height:60vh;object-fit:cover}.editorial-overlay{position:absolute;inset:0;background:rgba(23,23,23,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.editorial-overlay h2{font-size:clamp(48px,7vw,84px)}.editorial-overlay p{max-width:440px;padding:0 24px;font-size:14px;color:var(--muted);line-height:1.6}

footer{border-top:1px solid var(--border);padding:56px 32px}.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}.footer-logo{font-family:"Bebas Neue";font-size:24px;letter-spacing:.3em}.footer-grid h3{font-family:"Bebas Neue";font-size:18px}.footer-grid ul{list-style:none;padding:0;margin:12px 0 0;line-height:1.8;color:var(--muted);font-size:14px}.footer-grid a:hover{color:var(--fg)}.copyright{text-align:center;color:var(--muted);font-size:12px;margin-top:48px}

.page-title{font-size:clamp(56px,7vw,90px);line-height:.95}.tabs{display:flex;flex-wrap:wrap;gap:24px;margin-top:32px}.tabs a{font-size:12px;letter-spacing:.2em;color:var(--muted);padding-bottom:4px}.tabs a.active,.tabs a:hover{color:var(--fg)}.tabs a.active{border-bottom:1px solid var(--fg)}

.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:24px}.detail-image{position:relative;background:var(--secondary)}.detail-image img{width:100%;aspect-ratio:9/11;object-fit:cover}.detail-info{padding-top:24px}.detail-info h1{font-size:clamp(52px,6vw,82px);line-height:.95}.detail-price{font-size:20px;margin-top:12px}.description{max-width:520px;font-size:14px;line-height:1.7;color:var(--muted);margin-top:20px}.size-label{margin-top:32px}.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.size{background:none;border:1px solid var(--border);padding:9px 16px;font-size:12px;letter-spacing:.15em}.size.selected{background:var(--primary);color:var(--primary-fg);border-color:var(--fg)}.detail-actions{margin-top:32px;display:flex;flex-direction:column;width:320px;gap:12px}.details{margin-top:40px;border-top:1px solid var(--border);font-size:14px}.details div{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.related{margin-top:80px}.related h2{font-size:42px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px}.field{margin-bottom:20px}.field label{display:block}.field input,.field textarea{width:100%;margin-top:8px;background:transparent;border:1px solid var(--border);padding:12px 16px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--fg)}.faq{border-block:1px solid var(--border);margin-top:24px}.faq-item{padding:20px 0;border-bottom:1px solid var(--border)}.faq-item:last-child{border:0}.faq-item dt{font-weight:600;font-size:14px}.faq-item dd{margin:4px 0 0;color:var(--muted);font-size:14px}

.about-intro{max-width:900px}.about-intro h1{font-size:clamp(56px,7vw,96px);line-height:.95}.about-intro p{max-width:640px;line-height:1.7;color:var(--muted);font-size:14px;margin-top:24px}.about-values{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-block:1px solid var(--border)}.about-values>div{background:var(--bg);padding:48px 24px}.about-values h2{font-size:28px}.about-values p{color:var(--muted);font-size:14px;line-height:1.5}

@media(max-width:900px){
 .nav{display:none}.menu-btn{display:inline-flex}.sale-bar{padding:8px 16px}.navbar{padding:18px 16px}

 .footer-grid{grid-template-columns:repeat(2,1fr)}footer{padding:48px 16px}
 .product-detail{grid-template-columns:1fr}.detail-actions{width:100%;max-width:320px}.cart-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
 .value-grid,.about-values{grid-template-columns:1fr}.editorial img{height:55vh}
}

 .sale-bar .eyebrow{font-size:9px}.countdown{gap:7px}.countdown .num{font-size:17px}
 .grid-products{gap:32px 10px}.product-card h3{font-size:15px}.price{font-size:13px}
 .footer-grid{grid-template-columns:1fr 1fr}.hero h1{font-size:58px}.hero img{height:70vh}

/* ---------- Page entrance animations ---------- */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from {
        opacity: 0;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.animate-in {
    animation: fadeUp .65s ease both;
}

.hero-copy {
    animation: fadeUp .8s ease both;
}

.section-head {
    animation: fadeUp .65s ease both;
}

.product-card {
    animation: fadeUp .55s ease both;
}

.product-card:nth-child(2) { animation-delay: .06s; }
.product-card:nth-child(3) { animation-delay: .12s; }
.product-card:nth-child(4) { animation-delay: .18s; }

/* ---------- Search overlay ---------- */

.search-panel {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(23,23,23,.97);
    display: none;
    padding: 100px 32px 40px;
    overflow-y: auto;
    animation: fadeIn .2s ease both;
}

.search-panel.open {
    display: block;
}

.search-panel-inner {
    max-width: 1100px;
    margin: auto;
}

.search-close {
    position: absolute;
    right: 32px;
    top: 28px;
    background: none;
    border: 0;
    font-size: 28px;
}

.search-input-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 14px;
}

.search-input {
    width: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    font-size: clamp(32px, 5vw, 64px);
    font-family: "Bebas Neue", sans-serif;
}

.search-results {
    margin-top: 40px;
}

.search-empty {
    color: var(--muted);
    font-size: 15px;
}

/* ---------- Auth pages ---------- */

.auth-wrap {
    min-height: 65vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 80px 16px;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    border: 1px solid var(--border);
    padding: 40px;
    animation: scaleIn .45s ease both;
}

.auth-card h1 {
    font-size: 58px;
}

.auth-switch {
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
}

.auth-switch button {
    background: none;
    border: 0;
    text-decoration: underline;
    padding: 0;
}

/* ---------- Admin dashboard ---------- */

.admin-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: 70vh;
    border-top: 1px solid var(--border);
}

.admin-sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 20px;
}

.admin-sidebar h2 {
    font-size: 28px;
    margin-bottom: 24px;
}

.admin-sidebar button,
.admin-sidebar a {
    width: 100%;
    display: block;
    text-align: left;
    background: none;
    border: 0;
    padding: 11px 8px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .14em;
}

.admin-sidebar button:hover,
.admin-sidebar a:hover,
.admin-sidebar .active {
    color: var(--fg);
}

.admin-content {
    padding: 40px;
}

.admin-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.admin-top h1 {
    font-size: 56px;
}

.admin-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    margin-bottom: 36px;
}

.admin-stat {
    background: var(--bg);
    padding: 24px;
}

.admin-stat strong {
    display: block;
    font-family: "Bebas Neue";
    font-size: 42px;
    margin-top: 6px;
}

.admin-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.admin-table th,
.admin-table td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.admin-table th {
    font-size: 10px;
    letter-spacing: .15em;
    color: var(--muted);
}

.admin-product {
    display: flex;
    align-items: center;
    gap: 12px;
}

.admin-product img {
    width: 48px;
    height: 58px;
    object-fit: cover;
}

.admin-actions {
    display: flex;
    gap: 8px;
}

.admin-small-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 7px 10px;
    font-size: 11px;
}

.admin-small-btn:hover {
    border-color: var(--fg);
}

.admin-form {
    max-width: 700px;
    border: 1px solid var(--border);
    padding: 28px;
}

.admin-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.admin-form .full {
    grid-column: 1 / -1;
}

/* ---------- Toast notification ---------- */

.toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 200;
    background: var(--primary);
    color: var(--primary-fg);
    padding: 14px 18px;
    font-size: 13px;
    animation: fadeUp .25s ease both;
}

/* ---------- Hover polish ---------- */

.btn,
.category-tile,
.admin-small-btn,
.size,
.icon-btn {
    transition: transform .2s ease, opacity .2s ease, border-color .2s ease, background .2s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.category-tile:hover {
    transform: translateY(-3px);
}

@media (max-width: 800px) {
    .admin-layout {
        grid-template-columns: 1fr;
    }

    .admin-sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .admin-content {
        padding: 28px 16px;
    }

    .admin-stats {
        grid-template-columns: 1fr;
    }

    .admin-form-grid {
        grid-template-columns: 1fr;
    }

    .admin-form .full {
        grid-column: auto;
    }

    .search-panel {
        padding: 80px 16px 30px;
    }

    .search-close {
        right: 16px;
    }
}

    </style>

</head>

    <script>

/* =========================================================

const PRODUCTS=[
{slug:"vantage-cuban-chain",name:"Vantage Cuban Chain",img:"assets/p1.jpg",price:4299,mrp:6499,category:"chains",material:"925 Sterling Silver",description:"A 7mm diamond-cut cuban link with a hand-polished mirror finish and a reinforced box clasp. Built to sit heavy and hold shape.",details:["7mm width","Reinforced box clasp","Anti-tarnish rhodium finish","Weighs 62g"],sizes:['18"','20"','22"']},
{slug:"crest-signet-ring",name:"Crest Signet Ring",img:"assets/p2.jpg",price:2899,mrp:3999,category:"rings",material:"925 Sterling Silver",description:"A domed signet with a hand-engraved crest set in oxidised black. Rounded inner band for all-day wear.",details:["18mm face","Oxidised crest detail","Comfort-fit band","Weighs 14g"],sizes:["16","18","20","22"]},
{slug:"spike-hoop-earrings",name:"Spike Hoop Earrings",img:"assets/p3.jpg",price:1899,mrp:2799,category:"earrings",material:"925 Sterling Silver",description:"Fine 35mm hoops loaded with solid cone spikes. Light on the ear, loud on the eye.",details:["35mm diameter","Solid cast spikes","Hypoallergenic posts","Sold as a pair"],sizes:["One size"]},
{slug:"forge-hammered-cuff",name:"Forge Hammered Cuff",img:"assets/p4.jpg",price:3499,mrp:4999,category:"bracelets",material:"925 Sterling Silver",description:"A wide open cuff finished with a hand-hammered texture that catches light from every angle.",details:["20mm width","Hand-hammered surface","Adjustable open back","Weighs 41g"],sizes:["S/M","L/XL"]},
{slug:"vigil-cross-pendant",name:"Vigil Cross Pendant",img:"assets/p5.jpg",price:2299,mrp:3499,category:"chains",material:"925 Sterling Silver",description:"A sandblasted cross pendant with polished edges, hung on a fine cable chain. Quiet, but never plain.",details:["32mm pendant","Sandblasted centre",'Includes 20in cable chain',"Weighs 11g"],sizes:['18"','20"']},
{slug:"onyx-stack-ring-set",name:"Onyx Stack Ring Set",img:"assets/p6.jpg",price:2699,mrp:3899,category:"rings",material:"925 Silver & Black Onyx",description:"Three slim bands, one set with a cabochon black onyx. Wear stacked or split them across fingers.",details:["Set of 3 bands","Natural black onyx","2mm band width","Weighs 9g total"],sizes:["16","18","20"]}
];
const CATEGORIES=[
{slug:"chains",label:"Chains",blurb:"Heavyweight links and pendants in solid 925 silver."},
{slug:"rings",label:"Rings",blurb:"Signets, stacks and stones cast to be worn daily."},
{slug:"earrings",label:"Earrings",blurb:"Hoops, studs and spikes with real presence."},
{slug:"bracelets",label:"Bracelets",blurb:"Cuffs and chain bracelets with serious weight."}
];
const TICKER=["SHIPS UNDER 48 HOURS","LIMITED QUANTITIES","NO RESTOCKS","925 STERLING SILVER"];
const $=s=>document.querySelector(s);
const money=n=>"Rs. "+n.toLocaleString("en-IN");
const save=p=>Math.round(100-p.price/p.mrp*100);
const getProduct=slug=>PRODUCTS.find(p=>p.slug===slug);
let cart=JSON.parse(localStorage.getItem("aurvm-cart")||"[]");
let menuOpen=false;

function cartCount(){return cart.reduce((n,x)=>n+x.qty,0)}
function persist(){localStorage.setItem("aurvm-cart",JSON.stringify(cart));updateBadge()}
function updateBadge(){document.querySelectorAll(".cart-badge").forEach(e=>{const n=cartCount();e.textContent=n;e.style.display=n?"flex":"none"})}
function addCart(slug,size,qty=1){let x=cart.find(i=>i.slug===slug&&i.size===size);if(x)x.qty+=qty;else cart.push({slug,size,qty});persist()}
function removeCart(slug,size){cart=cart.filter(i=>!(i.slug===slug&&i.size===size));persist()}

let currentUser = JSON.parse(localStorage.getItem("aurvm-user") || "null");

function saveUser(user) {
    currentUser = user;
    localStorage.setItem("aurvm-user", JSON.stringify(user));
}

function logoutUser() {
    currentUser = null;
    localStorage.removeItem("aurvm-user");
    showToast("Logged out");
    history.pushState({}, "", "/");
    render();
}

function showToast(message) {
    document.querySelector(".toast")?.remove();

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;

    document.body.appendChild(toast);

    setTimeout(() => toast.remove(), 2200);
}

function searchPanel() {
    return `
        <div class="search-panel" id="searchPanel">

            <button class="search-close" id="searchClose" aria-label="Close search">
                ×
            </button>

            <div class="search-panel-inner">

                <p class="eyebrow muted">SEARCH AURVM</p>

                <div class="search-input-wrap">
                    ${icon("search")}

                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="SEARCH PRODUCTS..."
                        autocomplete="off"
                    >
                </div>

                <div id="searchResults" class="search-results">
                    ${searchResultHTML(PRODUCTS)}
                </div>

            </div>
        </div>
    `;
}

function searchResultHTML(list) {
    if (!list.length) {
        return `<p class="search-empty">No products found.</p>`;
    }

    return cards(list);
}

function openSearch() {
    let panel = document.querySelector("#searchPanel");

    if (!panel) {
        document.body.insertAdjacentHTML("beforeend", searchPanel());
        panel = document.querySelector("#searchPanel");
    }

    panel.classList.add("open");

    const input = document.querySelector("#searchInput");

    setTimeout(() => input?.focus(), 50);

    document.querySelector("#searchClose")?.addEventListener("click", closeSearch);

    input?.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();

        const results = PRODUCTS.filter(product => {
            return (
                product.name.toLowerCase().includes(query) ||
                product.category.toLowerCase().includes(query) ||
                product.material.toLowerCase().includes(query)
            );
        });

        document.querySelector("#searchResults").innerHTML =
            searchResultHTML(results);

        bindInternalLinks();
    });
}

function closeSearch() {
    document.querySelector("#searchPanel")?.classList.remove("open");
}

function authPage(mode = "login") {
    const isLogin = mode === "login";

    return `
        <main class="auth-wrap">

            <section class="auth-card">

                <p class="eyebrow muted">
                    AURVM ACCOUNT
                </p>

                <h1>
                    ${isLogin ? "WELCOME BACK" : "CREATE ACCOUNT"}
                </h1>

                <p class="muted" style="font-size:14px;margin-top:10px">
                    ${isLogin
                        ? "Sign in to manage your account and orders."
                        : "Create an account to save your shopping details."}
                </p>

                <form id="authForm" style="margin-top:30px">

                    ${
                        !isLogin
                            ? `
                                <div class="field">
                                    <label class="eyebrow muted">
                                        NAME
                                    </label>

                                    <input
                                        id="authName"
                                        required
                                    >
                                </div>
                              `
                            : ""
                    }

                    <div class="field">
                        <label class="eyebrow muted">
                            EMAIL
                        </label>

                        <input
                            id="authEmail"
                            type="email"
                            required
                        >
                    </div>

                    <div class="field">
                        <label class="eyebrow muted">
                            PASSWORD
                        </label>

                        <input
                            id="authPassword"
                            type="password"
                            minlength="4"
                            required
                        >
                    </div>

                    <button class="btn btn-primary" style="width:100%">
                        ${isLogin ? "LOGIN" : "CREATE ACCOUNT"}
                    </button>

                </form>

                <p class="auth-switch">
                    ${
                        isLogin
                            ? `Don't have an account?
                               <button id="switchAuth">Create one</button>`
                            : `Already have an account?
                               <button id="switchAuth">Login</button>`
                    }
                </p>

            </section>

        </main>
    `;
}

function bindAuth(mode) {
    document.querySelector("#switchAuth")?.addEventListener("click", () => {
        history.pushState({}, "", mode === "login" ? "/signup" : "/login");
        render();
    });

    document.querySelector("#authForm")?.addEventListener("submit", event => {
        event.preventDefault();

        const email = document.querySelector("#authEmail").value.trim();
        const password = document.querySelector("#authPassword").value;

        if (mode === "login") {
            const saved = JSON.parse(
                localStorage.getItem("aurvm-account") || "null"
            );

            if (!saved || saved.email !== email || saved.password !== password) {
                showToast("Account not found or password is incorrect");
                return;
            }

            saveUser({
                name: saved.name,
                email: saved.email
            });

            showToast("Welcome back!");
        } else {
            const name = document.querySelector("#authName").value.trim();

            localStorage.setItem(
                "aurvm-account",
                JSON.stringify({
                    name,
                    email,
                    password
                })
            );

            saveUser({ name, email });

            showToast("Account created!");
        }

        setTimeout(() => {
            history.pushState({}, "", "/");
            render();
        }, 500);
    });
}

function bindAdmin() {

    document.querySelector("#adminLoginForm")
        ?.addEventListener("submit", event => {

            event.preventDefault();

            const email =
                document.querySelector("#adminEmail").value.trim();

            const password =
                document.querySelector("#adminPassword").value.trim();

            if (
                email.toLowerCase() !== "admin@aurvm.com" ||
                password !== "admin123"
            ) {
                showToast("Invalid admin credentials");
                return;
            }

            saveUser({
                name: "Admin",
                email
            });

            render();
        });

    document.querySelector("#adminLogout")
        ?.addEventListener("click", logoutUser);

    const addButtons = [
        document.querySelector("#adminAddProduct"),
        document.querySelector("#adminAddProductTop")
    ];

    addButtons.forEach(button => {
        button?.addEventListener("click", () => {
            history.pushState({}, "", "/admin/add");
            render();
        });
    });

    document.querySelectorAll("[data-admin-edit]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const slug = button.dataset.adminEdit;
                const product = getProduct(slug);

                if (!product) return;

                history.pushState(
                    {},
                    "",
                    "/admin/edit/" + slug
                );

                render();
            });
        });

    document.querySelectorAll("[data-admin-delete]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const slug = button.dataset.adminDelete;
                const index =
                    PRODUCTS.findIndex(p => p.slug === slug);

                if (index === -1) return;

                PRODUCTS.splice(index, 1);

                showToast("Product removed");

                render();
            });
        });

    document.querySelector("#productAdminForm")
        ?.addEventListener("submit", event => {

            event.preventDefault();

            const slug =
                document.querySelector("#adminProductSlug").value;

            const productData = {
                slug: slug ||
                    document.querySelector("#adminProductName")
                        .value
                        .toLowerCase()
                        .trim()
                        .replace(/[^a-z0-9]+/g, "-"),

                name:
                    document.querySelector("#adminProductName").value,

                category:
                    document.querySelector("#adminProductCategory").value,

                price:
                    Number(document.querySelector("#adminProductPrice").value),

                mrp:
                    Number(document.querySelector("#adminProductMrp").value),

                img:
                    document.querySelector("#adminProductImage").value,

                description:
                    document.querySelector("#adminProductDescription").value,

                material: "925 Sterling Silver",

                details: [
                    "Premium 925 sterling silver",
                    "Anti-tarnish finish"
                ],

                sizes: ["One size"]
            };

            const existingIndex =
                PRODUCTS.findIndex(p => p.slug === slug);

            if (existingIndex >= 0) {
                PRODUCTS[existingIndex] = {
                    ...PRODUCTS[existingIndex],
                    ...productData
                };
                showToast("Product updated");
            } else {
                PRODUCTS.push(productData);
                showToast("Product added");
            }

            setTimeout(() => {
                history.pushState({}, "", "/admin");
                render();
            }, 400);
        });
}

/*
    NETLIFY ROUTING NOTE
    ---------------------
    The JavaScript handles /admin, /login, /signup, etc.
    inside the browser.

    A direct visit to /admin also needs Netlify's SPA fallback.
    That fallback is provided by the _redirects file included
    beside this index.html.
*/

/* ---------- Final feature-aware route rendering ---------- */

const baseRender = render;

render = function () {

    const path =
        location.pathname.replace(/\/$/, "") || "/";

    let content;

    if (path === "/login") {
        content = authPage("login");
    }
    else if (path === "/signup") {
        content = authPage("signup");
    }
    else if (path === "/account") {
        content = accountPage();
    }
    else if (path === "/admin") {
        content = adminPage();
    }
    else if (path === "/admin/add") {
        content = isAdmin()
            ? adminForm()
            : adminPage();
    }
    else if (path.startsWith("/admin/edit/")) {

        const slug = path.split("/")[3];
        const product = getProduct(slug);

        content = isAdmin() && product
            ? adminForm(product)
            : adminPage();
    }
    else {

        /* Use the original site's existing renderer
           for all normal store pages. */
        baseRender();
        return;
    }

    $("#app").innerHTML =
        header() +
        content +
        footer();

    updateBadge();
    bind();

    /* Feature-specific event binding */
    bindAuth(
        path === "/signup"
            ? "signup"
            : "login"
    );

    bindAdmin();

    document.querySelector("#logoutButton")
        ?.addEventListener("click", logoutUser);

    document.querySelector("#searchButton")
        ?.addEventListener("click", openSearch);

    window.scrollTo(0, 0);
};

};

/* ---------- Keyboard shortcut: press "/" to search ---------- */

document.addEventListener("keydown", event => {

    const tag = document.activeElement?.tagName;

    if (
        event.key === "/" &&
        tag !== "INPUT" &&
        tag !== "TEXTAREA"
    ) {
        event.preventDefault();
        openSearch();
    }

    if (event.key === "Escape") {
        closeSearch();
    }
});
