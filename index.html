footer{border-top:1px solid var(--border);padding:56px 32px}.footer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px}.footer-logo{font-family:"Bebas Neue";font-size:24px;letter-spacing:.3em}.footer-grid h3{font-family:"Bebas Neue";font-size:18px}.footer-grid ul{list-style:none;padding:0;margin:12px 0 0;line-height:1.8;color:var(--muted);font-size:14px}.footer-grid a:hover{color:var(--fg)}.copyright{text-align:center;color:var(--muted);font-size:12px;margin-top:48px}

.page-title{font-size:clamp(56px,7vw,90px);line-height:.95}.tabs{display:flex;flex-wrap:wrap;gap:24px;margin-top:32px}.tabs a{font-size:12px;letter-spacing:.2em;color:var(--muted);padding-bottom:4px}.tabs a.active,.tabs a:hover{color:var(--fg)}.tabs a.active{border-bottom:1px solid var(--fg)}

.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:24px}.detail-image{position:relative;background:var(--secondary)}.detail-image img{width:100%;aspect-ratio:9/11;object-fit:cover}.detail-info{padding-top:24px}.detail-info h1{font-size:clamp(52px,6vw,82px);line-height:.95}.detail-price{font-size:20px;margin-top:12px}.description{max-width:520px;font-size:14px;line-height:1.7;color:var(--muted);margin-top:20px}.size-label{margin-top:32px}.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.size{background:none;border:1px solid var(--border);padding:9px 16px;font-size:12px;letter-spacing:.15em}.size.selected{background:var(--primary);color:var(--primary-fg);border-color:var(--fg)}.detail-actions{margin-top:32px;display:flex;flex-direction:column;width:320px;gap:12px}.details{margin-top:40px;border-top:1px solid var(--border);font-size:14px}.details div{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.related{margin-top:80px}.related h2{font-size:42px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px}.field{margin-bottom:20px}.field label{display:block}.field input,.field textarea{width:100%;margin-top:8px;background:transparent;border:1px solid var(--border);padding:12px 16px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--fg)}.faq{border-block:1px solid var(--border);margin-top:24px}.faq-item{padding:20px 0;border-bottom:1px solid var(--border)}.faq-item:last-child{border:0}.faq-item dt{font-weight:600;font-size:14px}.faq-item dd{margin:4px 0 0;color:var(--muted);font-size:14px}

 .grid-products{gap:32px 10px}.product-card h3{font-size:15px}.price{font-size:13px}

/* =========================================================
   NEW FEATURES
   1. Login / Signup
   2. Admin Dashboard

   10. Animations

/* ---------- Page entrance animations ---------- */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from {
        opacity: 0;
        transform: scale(.96);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.animate-in {
    animation: fadeUp .65s ease both;
}

.hero-copy {
    animation: fadeUp .8s ease both;
}

.section-head {
    animation: fadeUp .65s ease both;
}

.product-card {
    animation: fadeUp .55s ease both;
}

.product-card:nth-child(2) { animation-delay: .06s; }
.product-card:nth-child(3) { animation-delay: .12s; }
.product-card:nth-child(4) { animation-delay: .18s; }

/* ---------- Search overlay ---------- */

.search-panel {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(23,23,23,.97);
    display: none;
    padding: 100px 32px 40px;
    overflow-y: auto;
    animation: fadeIn .2s ease both;
}

.search-panel.open {
    display: block;
}

.search-panel-inner {
    max-width: 1100px;
    margin: auto;
}

.search-close {
    position: absolute;
    right: 32px;
    top: 28px;
    background: none;
    border: 0;
    font-size: 28px;
}

.search-input-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 14px;
}

.search-input {
    width: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    font-size: clamp(32px, 5vw, 64px);
    font-family: "Bebas Neue", sans-serif;
}

.search-results {
    margin-top: 40px;
}

.search-empty {
    color: var(--muted);
    font-size: 15px;
}

/* ---------- Auth pages ---------- */

.auth-wrap {
    min-height: 65vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 80px 16px;
}

.auth-card {
    width: 100%;
    max-width: 460px;
    border: 1px solid var(--border);
    padding: 40px;
    animation: scaleIn .45s ease both;
}

.auth-card h1 {
    font-size: 58px;
}

.auth-switch {
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
}

.auth-switch button {
    background: none;
    border: 0;
    text-decoration: underline;
    padding: 0;
}

/* ---------- Admin dashboard ---------- */

.admin-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: 70vh;
    border-top: 1px solid var(--border);
}

.admin-sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 20px;
}

.admin-sidebar h2 {
    font-size: 28px;
    margin-bottom: 24px;
}

.admin-sidebar button,
.admin-sidebar a {
    width: 100%;
    display: block;
    text-align: left;
    background: none;
    border: 0;
    padding: 11px 8px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .14em;
}

.admin-sidebar button:hover,
.admin-sidebar a:hover,
.admin-sidebar .active {
    color: var(--fg);
}

.admin-content {
    padding: 40px;
}

.admin-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.admin-top h1 {
    font-size: 56px;
}

.admin-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    margin-bottom: 36px;
}

.admin-stat {
    background: var(--bg);
    padding: 24px;
}

.admin-stat strong {
    display: block;
    font-family: "Bebas Neue";
    font-size: 42px;
    margin-top: 6px;
}

.admin-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.admin-table th,
.admin-table td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

.admin-table th {
    font-size: 10px;
    letter-spacing: .15em;
    color: var(--muted);
}

.admin-product {
    display: flex;
    align-items: center;
    gap: 12px;
}

.admin-product img {
    width: 48px;
    height: 58px;
    object-fit: cover;
}

.admin-actions {
    display: flex;
    gap: 8px;
}

.admin-small-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 7px 10px;
    font-size: 11px;
}

.admin-small-btn:hover {
    border-color: var(--fg);
}

.admin-form {
    max-width: 700px;
    border: 1px solid var(--border);
    padding: 28px;
}

.admin-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.admin-form .full {
    grid-column: 1 / -1;
}

/* ---------- Toast notification ---------- */

.toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 200;
    background: var(--primary);
    color: var(--primary-fg);
    padding: 14px 18px;
    font-size: 13px;
    animation: fadeUp .25s ease both;
}

/* ---------- Hover polish ---------- */

.btn,
.category-tile,
.admin-small-btn,
.size,
.icon-btn {
    transition: transform .2s ease, opacity .2s ease, border-color .2s ease, background .2s ease;
}

.btn:hover {
    transform: translateY(-2px);
}

.category-tile:hover {
    transform: translateY(-3px);
}

@media (max-width: 800px) {
    .admin-layout {
        grid-template-columns: 1fr;
    }

    .admin-sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .admin-content {
        padding: 28px 16px;
    }

    .admin-stats {
        grid-template-columns: 1fr;
    }

    .admin-form-grid {
        grid-template-columns: 1fr;
    }

    .admin-form .full {
        grid-column: auto;
    }

    .search-panel {
        padding: 80px 16px 30px;
    }

    .search-close {
        right: 16px;
    }
}

    
/* =========================================================
   FRONTEND V2
   Wishlist • Filters • Sorting • Gallery • Cart Drawer
   Checkout • Orders • Account Dashboard • Admin polish
   ========================================================= */

/* ---------- Global polish ---------- */

html {
    scroll-behavior: smooth;
}

::selection {
    background: var(--primary);
    color: var(--primary-fg);
}

button,
a,
input,
select,
textarea {
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: 1px solid var(--fg);
    outline-offset: 3px;
}

/* ---------- Product tools ---------- */

.shop-toolbar {
    margin-top: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    border-block: 1px solid var(--border);
    padding: 14px 0;
}

.shop-count {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .12em;
}

.shop-controls {
    display: flex;
    gap: 8px;
    align-items: center;
}

.filter-btn,
.sort-select {
    background: transparent;
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
}

.sort-select {
    color: var(--fg);
}

.sort-select option {
    background: var(--bg);
    color: var(--fg);
}

.filter-drawer {
    display: none;
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    animation: fadeUp .25s ease both;
}

.filter-drawer.open {
    display: block;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.filter-option {
    background: transparent;
    border: 1px solid var(--border);
    padding: 11px 12px;
    text-align: left;
    font-size: 11px;
    letter-spacing: .1em;
}

.filter-option.active {
    background: var(--primary);
    color: var(--primary-fg);
    border-color: var(--primary);
}

.filter-label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .18em;
    margin-bottom: 8px;
}

/* ---------- Wishlist ---------- */

.product-card .media {
    position: relative;
}

.wishlist-btn {
    position: absolute;
    right: 10px;
    top: 10px;
    z-index: 5;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(23,23,23,.72);
    backdrop-filter: blur(5px);
}

.wishlist-btn.active {
    background: var(--primary);
    color: var(--primary-fg);
}

.wishlist-btn svg {
    width: 18px;
    height: 18px;
}

.wishlist-grid {
    margin-top: 36px;
}

.wishlist-empty {
    border: 1px solid var(--border);
    padding: 70px 20px;
    text-align: center;
}

/* ---------- Product gallery ---------- */

.gallery {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 12px;
}

.gallery-main {
    position: relative;
    background: var(--secondary);
    overflow: hidden;
}

.gallery-main img {
    width: 100%;
    aspect-ratio: 9 / 11;
    object-fit: cover;
}

.gallery-thumbs {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.gallery-thumb {
    padding: 0;
    border: 1px solid var(--border);
    background: var(--secondary);
    cursor: pointer;
}

.gallery-thumb.active {
    border-color: var(--fg);
}

.gallery-thumb img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
}

.zoom-hint {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(23,23,23,.75);
    padding: 7px 10px;
    font-size: 9px;
    letter-spacing: .15em;
}

/* ---------- Cart drawer ---------- */

.cart-drawer {
    position: fixed;
    inset: 0;
    z-index: 120;
    visibility: hidden;
}

.cart-drawer.open {
    visibility: visible;
}

.cart-drawer-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.62);
    opacity: 0;
    transition: opacity .25s ease;
}

.cart-drawer.open .cart-drawer-backdrop {
    opacity: 1;
}

.cart-drawer-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: min(430px, 100%);
    height: 100%;
    background: var(--bg);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform .3s ease;
    display: flex;
    flex-direction: column;
}

.cart-drawer.open .cart-drawer-panel {
    transform: translateX(0);
}

.cart-drawer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px;
    border-bottom: 1px solid var(--border);
}

.cart-drawer-head h2 {
    font-size: 32px;
}

.cart-drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.drawer-item {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.drawer-item img {
    width: 74px;
    height: 88px;
    object-fit: cover;
}

.drawer-item-name {
    font-size: 14px;
}

.drawer-item-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.drawer-qty {
    display: flex;
    width: max-content;
    border: 1px solid var(--border);
    margin-top: 10px;
}

.drawer-qty button,
.drawer-qty span {
    border: 0;
    background: none;
    padding: 4px 9px;
    font-size: 11px;
}

.cart-drawer-foot {
    padding: 20px;
    border-top: 1px solid var(--border);
}

.drawer-total {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    margin-bottom: 14px;
}

/* ---------- Checkout ---------- */

.checkout-layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 50px;
    margin-top: 40px;
}

.checkout-steps {
    display: flex;
    gap: 18px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.checkout-step {
    font-size: 10px;
    letter-spacing: .16em;
    color: var(--muted);
    padding-bottom: 6px;
}

.checkout-step.active {
    color: var(--fg);
    border-bottom: 1px solid var(--fg);
}

.checkout-card {
    border: 1px solid var(--border);
    padding: 26px;
}

.checkout-card + .checkout-card {
    margin-top: 14px;
}

.checkout-card h2 {
    font-size: 30px;
}

.checkout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 20px;
}

.checkout-grid .full {
    grid-column: 1 / -1;
}

.checkout-radio-list {
    margin-top: 18px;
    display: grid;
    gap: 10px;
}

.checkout-radio {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    padding: 13px;
    font-size: 13px;
}

.checkout-summary {
    border: 1px solid var(--border);
    padding: 24px;
    height: max-content;
    position: sticky;
    top: 120px;
}

.checkout-summary h2 {
    font-size: 30px;
}

.checkout-product {
    display: flex;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.checkout-product img {
    width: 58px;
    height: 70px;
    object-fit: cover;
}

.checkout-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

/* ---------- Order pages ---------- */

.order-list {
    margin-top: 36px;
    display: grid;
    gap: 12px;
}

.order-card {
    border: 1px solid var(--border);
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
}

.order-card h3 {
    font-family: Barlow, sans-serif;
    font-size: 17px;
    letter-spacing: .04em;
}

.status-pill {
    display: inline-block;
    border: 1px solid var(--border);
    padding: 5px 9px;
    font-size: 9px;
    letter-spacing: .14em;
    margin-top: 8px;
}

.order-detail-layout {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 30px;
    margin-top: 36px;
}

.order-items {
    border-top: 1px solid var(--border);
}

.order-item {
    display: flex;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
}

.order-item img {
    width: 76px;
    height: 92px;
    object-fit: cover;
}

/* ---------- Account dashboard ---------- */

.account-grid {
    margin-top: 36px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 30px;
}

.account-menu {
    border: 1px solid var(--border);
    padding: 14px;
    height: max-content;
}

.account-menu button,
.account-menu a {
    width: 100%;
    text-align: left;
    display: block;
    background: none;
    border: 0;
    padding: 11px 8px;
    font-size: 11px;
    letter-spacing: .13em;
    color: var(--muted);
}

.account-menu .active,
.account-menu button:hover,
.account-menu a:hover {
    color: var(--fg);
}

.account-panel {
    border: 1px solid var(--border);
    padding: 28px;
}

.account-panel h2 {
    font-size: 34px;
}

/* ---------- Admin dashboard improvements ---------- */

.admin-stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    margin-bottom: 30px;
}

.admin-stat-grid .admin-stat {
    min-height: 120px;
}

.admin-order-table {
    margin-top: 32px;
}

.stock-low {
    color: var(--accent);
}

.stock-ok {
    color: var(--muted);
}

.admin-section {
    margin-top: 38px;
}

/* ---------- Toast variations ---------- */

.toast.success {
    background: var(--primary);
    color: var(--primary-fg);
}

.toast.error {
    background: var(--accent);
    color: var(--fg);
}

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
    .filter-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .checkout-layout,
    .order-detail-layout {
        grid-template-columns: 1fr;
    }

    .checkout-summary {
        position: static;
    }

    .account-grid {
        grid-template-columns: 1fr;
    }

    .admin-stat-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .shop-toolbar {
        align-items: stretch;
        flex-direction: column;
    }

    .shop-controls {
        width: 100%;
    }

    .filter-btn,
    .sort-select {
        flex: 1;
    }

    .filter-grid {
        grid-template-columns: 1fr 1fr;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

    .gallery-thumbs {
        flex-direction: row;
        overflow-x: auto;
    }

    .gallery-thumb {
        min-width: 70px;
    }

    .checkout-grid {
        grid-template-columns: 1fr;
    }

    .checkout-grid .full {
        grid-column: auto;
    }

    .order-card {
        grid-template-columns: 1fr;
    }

    .admin-stat-grid {
        grid-template-columns: 1fr 1fr;
    }
}

    </style>

</head>


<body>

    <!-- =====================================================
         WEBSITE ROOT

         JavaScript creates the website inside this element.

    <div id="app"></div>


    <!-- =====================================================
         ALL JAVASCRIPT
         ===================================================== -->

    <script>


/* =========================================================
   AURVM — JAVASCRIPT
   This section controls:
   - Products and categories
   - Navigation
   - Shopping cart
   - Product pages
   - Contact form
   - Countdown
   ========================================================= */

const PRODUCTS=[
{slug:"vantage-cuban-chain",name:"Vantage Cuban Chain",img:"assets/p1.jpg",price:4299,mrp:6499,category:"chains",material:"925 Sterling Silver",description:"A 7mm diamond-cut cuban link with a hand-polished mirror finish and a reinforced box clasp. Built to sit heavy and hold shape.",details:["7mm width","Reinforced box clasp","Anti-tarnish rhodium finish","Weighs 62g"],sizes:['18"','20"','22"']},
{slug:"crest-signet-ring",name:"Crest Signet Ring",img:"assets/p2.jpg",price:2899,mrp:3999,category:"rings",material:"925 Sterling Silver",description:"A domed signet with a hand-engraved crest set in oxidised black. Rounded inner band for all-day wear.",details:["18mm face","Oxidised crest detail","Comfort-fit band","Weighs 14g"],sizes:["16","18","20","22"]},
{slug:"spike-hoop-earrings",name:"Spike Hoop Earrings",img:"assets/p3.jpg",price:1899,mrp:2799,category:"earrings",material:"925 Sterling Silver",description:"Fine 35mm hoops loaded with solid cone spikes. Light on the ear, loud on the eye.",details:["35mm diameter","Solid cast spikes","Hypoallergenic posts","Sold as a pair"],sizes:["One size"]},
{slug:"forge-hammered-cuff",name:"Forge Hammered Cuff",img:"assets/p4.jpg",price:3499,mrp:4999,category:"bracelets",material:"925 Sterling Silver",description:"A wide open cuff finished with a hand-hammered texture that catches light from every angle.",details:["20mm width","Hand-hammered surface","Adjustable open back","Weighs 41g"],sizes:["S/M","L/XL"]},
{slug:"vigil-cross-pendant",name:"Vigil Cross Pendant",img:"assets/p5.jpg",price:2299,mrp:3499,category:"chains",material:"925 Sterling Silver",description:"A sandblasted cross pendant with polished edges, hung on a fine cable chain. Quiet, but never plain.",details:["32mm pendant","Sandblasted centre",'Includes 20in cable chain',"Weighs 11g"],sizes:['18"','20"']},
{slug:"onyx-stack-ring-set",name:"Onyx Stack Ring Set",img:"assets/p6.jpg",price:2699,mrp:3899,category:"rings",material:"925 Silver & Black Onyx",description:"Three slim bands, one set with a cabochon black onyx. Wear stacked or split them across fingers.",details:["Set of 3 bands","Natural black onyx","2mm band width","Weighs 9g total"],sizes:["16","18","20"]}
];
const CATEGORIES=[
{slug:"chains",label:"Chains",blurb:"Heavyweight links and pendants in solid 925 silver."},
{slug:"rings",label:"Rings",blurb:"Signets, stacks and stones cast to be worn daily."},
{slug:"earrings",label:"Earrings",blurb:"Hoops, studs and spikes with real presence."},
{slug:"bracelets",label:"Bracelets",blurb:"Cuffs and chain bracelets with serious weight."}
];
const TICKER=["SHIPS UNDER 48 HOURS","LIMITED QUANTITIES","NO RESTOCKS","925 STERLING SILVER"];
const $=s=>document.querySelector(s);
const money=n=>"Rs. "+n.toLocaleString("en-IN");
const save=p=>Math.round(100-p.price/p.mrp*100);
const getProduct=slug=>PRODUCTS.find(p=>p.slug===slug);
let cart=JSON.parse(localStorage.getItem("aurvm-cart")||"[]");
let menuOpen=false;

function cartCount(){return cart.reduce((n,x)=>n+x.qty,0)}
function persist(){localStorage.setItem("aurvm-cart",JSON.stringify(cart));updateBadge()}
function updateBadge(){document.querySelectorAll(".cart-badge").forEach(e=>{const n=cartCount();e.textContent=n;e.style.display=n?"flex":"none"})}
function addCart(slug,size,qty=1){let x=cart.find(i=>i.slug===slug&&i.size===size);if(x)x.qty+=qty;else cart.push({slug,size,qty});persist()}
function removeCart(slug,size){cart=cart.filter(i=>!(i.slug===slug&&i.size===size));persist()}
function setQty(slug,size,qty){cart=cart.map(i=>i.slug===slug&&i.size===size?{...i,qty}:i).filter(i=>i.qty>0);persist()}
function icon(type){
 const paths={search:'<circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>',user:'<circle cx="12" cy="7" r="4"></circle><path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>',bag:'<path d="M5 8h14l-1 13H6L5 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path>',menu:'<path d="M4 6h16M4 12h16M4 18h16"></path>',x:'<path d="M5 5l14 14M19 5 5 19"></path>'};
 return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">${paths[type]}</svg>`;
}
function header(){
 return `<header class="site-header"><div class="sale-bar"><p class="eyebrow">FESTIVE SILVER SALE \\ UPTO 40% OFF</p><div class="countdown" id="countdown"></div></div>
 <div class="navbar"><a class="logo" href="/">AURVM</a><nav class="nav">${navLinks()}</nav>
 <div class="actions">
    <button class="icon-btn" id="searchButton" aria-label="Search">
        ${icon("search")}
    </button>

    <a class="icon-btn" href="${currentUser ? "/account" : "/login"}" aria-label="Account">
        ${icon("user")}
    </a>

    <a class="icon-btn" href="/cart" aria-label="Cart">
        ${icon("bag")}
        <span class="cart-badge">${cartCount()}</span>
    </a>

    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        ${icon(menuOpen ? "x" : "menu")}
    </button>
</div></div>
 <nav class="mobile-nav ${menuOpen?"open":""}">${navLinks()}</nav></header>`;
}
function navLinks(){return `<a href="/shop">NEW DROPS</a>${CATEGORIES.map(c=>`<a href="/shop/${c.slug}">${c.label.toUpperCase()}</a>`).join("")}<a href="/about">ABOUT</a><a href="/contact">CONTACT</a>`}
function footer(){return `<footer><div class="footer-grid"><div><p class="footer-logo">AURVM</p><p class="muted" style="max-width:280px;font-size:14px;margin-top:12px">Heavyweight silver jewellery for people who don't do subtle.</p></div><div><h3>SHOP</h3><ul>${CATEGORIES.map(c=>`<li><a href="/shop/${c.slug}">${c.label}</a></li>`).join("")}</ul></div><div><h3>HELP</h3><ul><li><a href="/contact">Shipping & Returns</a></li><li><a href="/contact">Size Guide</a></li><li><a href="/contact">Care Guide</a></li><li><a href="/cart">Your Cart</a></li></ul></div><div><h3>BRAND</h3><ul><li><a href="/about">Our Story</a></li><li><a href="/shop">All Products</a></li><li><a href="/contact">Contact</a></li></ul></div></div><p class="copyright">© ${new Date().getFullYear()} AURVM. All rights reserved.</p></footer>`}
function card(p){return `<article class="product-card"><a href="/product/${p.slug}" class="media"><span class="save">SAVE ${save(p)}%</span><img src="${p.img}" alt="${p.name}" loading="lazy"><span class="view-product">VIEW PRODUCT</span></a><h3><a href="/product/${p.slug}">${p.name}</a></h3><p class="price">${money(p.price)} <span class="old">${money(p.mrp)}</span></p></article>`}
function cards(list){return `<div class="grid-products">${list.map(card).join("")}</div>`}
function categories(){return `<div class="category-grid">${CATEGORIES.map(c=>`<a class="category-tile" href="/shop/${c.slug}"><h3>${c.label.toUpperCase()}</h3><p>${c.blurb}</p><p class="eyebrow muted">SHOP NOW →</p></a>`).join("")}</div>`}
function home(){
 return `<main><section class="hero"><img src="assets/hero.jpg" alt="Models wearing layered silver chains and rings"><div class="hero-overlay"></div><div class="hero-copy"><p class="eyebrow muted">DROP 04 — SILVER RITUAL</p><h1>WEIGHT YOU<br>CAN FEEL</h1><a class="btn btn-primary" href="/shop">SHOP THE DROP</a></div></section>
 <div class="marquee"><div class="marquee-track">${[0,1].map(()=>`<div>${[...TICKER,...TICKER,...TICKER].map(t=>`<span class="eyebrow marquee-item">${t}</span>`).join("")}</div>`).join("")}</div></div>
 <section class="section"><div class="section-head"><p class="eyebrow muted">NEW ARRIVALS</p><h2>JUST DROPPED</h2></div>${cards(PRODUCTS.slice(0,4))}<div class="view-all"><a class="btn" href="/shop">VIEW ALL PRODUCTS</a></div></section>
 <section class="section" style="border-top:1px solid var(--border)"><div class="section-head"><p class="eyebrow muted">COLLECTIONS</p><h2>SHOP BY CATEGORY</h2></div>${categories()}</section>
 <section class="editorial"><img src="assets/editorial.jpg" alt="Close-up of layered silver chains"><div class="editorial-overlay"><h2>MADE IN 925</h2><p>Solid sterling silver, anti-tarnish finished and hand-polished in small batches. Once a drop sells out, it never comes back.</p><a class="btn" href="/about">OUR STORY</a></div></section>
 <section class="value-grid"><div class="value"><h3>48 HOUR DISPATCH</h3><p>Every order leaves our studio within two days.</p></div><div class="value"><h3>LIFETIME POLISH</h3><p>Free re-polishing on all AURVM pieces, forever.</p></div><div class="value"><h3>EASY RETURNS</h3><p>7-day no-questions returns across India.</p></div></section></main>`;
}
function shop(category){
 const active=category?CATEGORIES.find(c=>c.slug===category):null;
 const list=active?PRODUCTS.filter(p=>p.category===category):PRODUCTS;
 return `<main class="container"><p class="eyebrow muted">${active?"COLLECTION":"ALL PRODUCTS"}</p><h1 class="page-title">${active?active.label.toUpperCase():"THE FULL RANGE"}</h1>${active?`<p class="muted" style="max-width:520px;margin-top:12px;font-size:14px">${active.blurb}</p>`:""}<div class="tabs"><a href="/shop" class="${!active?"active":""}">ALL</a>${CATEGORIES.map(c=>`<a href="/shop/${c.slug}" class="${active&&active.slug===c.slug?"active":""}">${c.label.toUpperCase()}</a>`).join("")}</div>${cards(list)}</main>`;
}
function productPage(p){
 let size=p.sizes[0];
 return `<main class="container"><nav class="eyebrow muted"><a href="/shop">SHOP</a> / <a href="/shop/${p.category}">${p.category.toUpperCase()}</a></nav><div class="product-detail"><div class="detail-image"><span class="save">SAVE ${save(p)}%</span><img src="${p.img}" alt="${p.name}"></div><div class="detail-info"><h1>${p.name.toUpperCase()}</h1><p class="detail-price">${money(p.price)} <span class="old">${money(p.mrp)}</span></p><p class="description">${p.description}</p><p class="eyebrow muted size-label">SIZE</p><div class="sizes">${p.sizes.map((s,i)=>`<button class="size ${i===0?"selected":""}" data-size="${s}">${s}</button>`).join("")}</div><div class="detail-actions"><button class="btn btn-primary" id="addBtn">ADD TO CART</button><a class="btn" href="/cart">VIEW CART</a></div><div class="details"><div><span class="muted">Material</span><span>${p.material}</span></div>${p.details.map(d=>`<div><span class="muted">${d}</span></div>`).join("")}</div></div></div><section class="related"><h2>YOU MIGHT ALSO LIKE</h2>${cards(PRODUCTS.filter(x=>x.slug!==p.slug).slice(0,4))}</section></main>`;
}
function about(){
 return `<main><section class="container about-intro"><p class="eyebrow muted">SINCE 2019</p><h1>SILVER THAT ACTS LIKE ARMOUR</h1><p>AURVM started in a two-bench studio with one rule: nothing hollow. Every chain, ring and cuff is cast in solid 925 sterling silver, filed by hand and polished until it throws light. We drop in small runs, and when a run sells out it does not come back.</p></section><img src="assets/editorial.jpg" style="width:100%;height:50vh;object-fit:cover" alt="Layered silver chains"><section class="about-values"><div><h2>SOLID, NEVER PLATED</h2><p>925 sterling throughout — no filler, no flash-plating.</p></div><div><h2>SMALL BATCH</h2><p>Runs of 150 pieces or fewer, then the mould is retired.</p></div><div><h2>LIFETIME POLISH</h2><p>Send any AURVM piece back for free re-polishing, forever.</p></div></section><section class="section center"><h2 style="font-size:48px">WEAR IT EVERY DAY</h2><a class="btn btn-primary" style="margin-top:24px" href="/shop">SHOP THE RANGE</a></section></main>`;
}
function contact(){
 return `<main class="container"><p class="eyebrow muted">WE REPLY IN ONE WORKING DAY</p><h1 class="page-title">GET IN TOUCH</h1><div class="form-grid" style="margin-top:48px"><div id="contactBox"><form id="contactForm"><div class="field"><label class="eyebrow muted" for="name">NAME</label><input id="name" required></div><div class="field"><label class="eyebrow muted" for="email">EMAIL</label><input id="email" type="email" required></div><div class="field"><label class="eyebrow muted" for="message">MESSAGE</label><textarea id="message" rows="5" required></textarea></div><button class="btn btn-primary" type="submit">SEND MESSAGE</button></form><div class="muted" style="font-size:14px;margin-top:40px;line-height:1.6"><p>studio@aurvm.example</p><p>+91 98000 00000 · Mon–Sat, 10am–7pm IST</p><p>Unit 4, Silver Lane, Mumbai 400001</p></div></div><div><h2 style="font-size:40px">FAQ</h2><dl class="faq">${[["How fast do you ship?","Every order leaves the studio within 48 hours, India-wide."],["Can I return a piece?","Yes — 7 days, unworn, with the original pouch."],["How do I find my ring size?","Message us your finger circumference in mm and we'll size it."],["Will it tarnish?","All pieces are anti-tarnish finished; free re-polishing for life."]].map(x=>`<div class="faq-item"><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl></div></div></main>`;
}
function cartPage(){
 const detailed=cart.map(x=>({...x,product:getProduct(x.slug)})).filter(x=>x.product);
 if(!detailed.length)return `<main class="container"><h1 class="page-title">YOUR CART</h1><div class="empty"><p class="muted">Your cart is empty.</p><a class="btn btn-primary" style="margin-top:24px" href="/shop">SHOP THE DROP</a></div></main>`;
 const subtotal=detailed.reduce((n,x)=>n+x.product.price*x.qty,0);
 return `<main class="container"><h1 class="page-title">YOUR CART</h1><div class="cart-layout"><ul class="cart-list">${detailed.map(x=>`<li class="cart-row"><img src="${x.product.img}" alt="${x.product.name}"><div class="cart-main"><a class="cart-name" href="/product/${x.product.slug}">${x.product.name}</a><p class="cart-meta">Size ${x.size}</p><p style="font-size:14px">${money(x.product.price)}</p><div class="qty"><button data-minus="${x.slug}|${x.size}">−</button><span>${x.qty}</span><button data-plus="${x.slug}|${x.size}">+</button></div><button class="icon-btn muted" style="margin-top:10px" data-remove="${x.slug}|${x.size}" aria-label="Remove item">Remove</button></div><p style="font-size:14px">${money(x.product.price*x.qty)}</p></li>`).join("")}</ul><aside class="summary"><h2>SUMMARY</h2><div class="summary-line"><span class="muted">Subtotal</span><span>${money(subtotal)}</span></div><div class="summary-line"><span class="muted">Shipping</span><span>Free</span></div><div class="summary-line summary-total"><span>Total</span><span>${money(subtotal)}</span></div><button class="btn btn-primary" style="width:100%;margin-top:24px" id="checkout">CHECKOUT</button><a class="btn" style="width:100%;text-align:center;margin-top:12px" href="/shop">CONTINUE SHOPPING</a></aside></div></main>`;
}
function render(){
 const path=location.pathname.replace(/\/$/,"")||"/";
 let content;
 if(path==="/")content=home();

let currentUser = JSON.parse(localStorage.getItem("aurvm-user") || "null");

function saveUser(user) {
    currentUser = user;
    localStorage.setItem("aurvm-user", JSON.stringify(user));
}

function logoutUser() {
    currentUser = null;
    localStorage.removeItem("aurvm-user");
    showToast("Logged out");
    history.pushState({}, "", "/");
    render();
}

function showToast(message) {
    document.querySelector(".toast")?.remove();

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;

    document.body.appendChild(toast);

    setTimeout(() => toast.remove(), 2200);
}

function searchPanel() {
    return `
        <div class="search-panel" id="searchPanel">

            <button class="search-close" id="searchClose" aria-label="Close search">
                ×
            </button>

            <div class="search-panel-inner">

                <p class="eyebrow muted">SEARCH AURVM</p>

                <div class="search-input-wrap">
                    ${icon("search")}

                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="SEARCH PRODUCTS..."
                        autocomplete="off"
                    >
                </div>

                <div id="searchResults" class="search-results">
                    ${searchResultHTML(PRODUCTS)}
                </div>

            </div>
        </div>
    `;
}

function searchResultHTML(list) {
    if (!list.length) {
        return `<p class="search-empty">No products found.</p>`;
    }

    return cards(list);
}

function openSearch() {
    let panel = document.querySelector("#searchPanel");

    if (!panel) {
        document.body.insertAdjacentHTML("beforeend", searchPanel());
        panel = document.querySelector("#searchPanel");
    }

    panel.classList.add("open");

    const input = document.querySelector("#searchInput");

    setTimeout(() => input?.focus(), 50);

    document.querySelector("#searchClose")?.addEventListener("click", closeSearch);

    input?.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();

        const results = PRODUCTS.filter(product => {
            return (
                product.name.toLowerCase().includes(query) ||
                product.category.toLowerCase().includes(query) ||
                product.material.toLowerCase().includes(query)
            );
        });

        document.querySelector("#searchResults").innerHTML =
            searchResultHTML(results);

        bindInternalLinks();
    });
}

function closeSearch() {
    document.querySelector("#searchPanel")?.classList.remove("open");
}

function bindAuth(mode) {
    document.querySelector("#switchAuth")?.addEventListener("click", () => {
        history.pushState({}, "", mode === "login" ? "/signup" : "/login");
        render();
    });

    document.querySelector("#authForm")?.addEventListener("submit", event => {
        event.preventDefault();

        const email = document.querySelector("#authEmail").value.trim();
        const password = document.querySelector("#authPassword").value;

        if (mode === "login") {
            const saved = JSON.parse(
                localStorage.getItem("aurvm-account") || "null"
            );

            if (!saved || saved.email !== email || saved.password !== password) {
                showToast("Account not found or password is incorrect");
                return;
            }

            saveUser({
                name: saved.name,
                email: saved.email
            });

            showToast("Welcome back!");
        } else {
            const name = document.querySelector("#authName").value.trim();

            localStorage.setItem(
                "aurvm-account",
                JSON.stringify({
                    name,
                    email,
                    password
                })
            );

            saveUser({ name, email });

            showToast("Account created!");
        }

        setTimeout(() => {
            history.pushState({}, "", "/");
            render();
        }, 500);
    });
}

function bindAdmin() {

    document.querySelector("#adminLoginForm")
        ?.addEventListener("submit", event => {

            event.preventDefault();

            const email =
                document.querySelector("#adminEmail").value.trim();

            const password =
                document.querySelector("#adminPassword").value.trim();

            if (
                email.toLowerCase() !== "admin@aurvm.com" ||
                password !== "admin123"
            ) {
                showToast("Invalid admin credentials");
                return;
            }

            saveUser({
                name: "Admin",
                email
            });

            render();
        });

    document.querySelector("#adminLogout")
        ?.addEventListener("click", logoutUser);

    const addButtons = [
        document.querySelector("#adminAddProduct"),
        document.querySelector("#adminAddProductTop")
    ];

    addButtons.forEach(button => {
        button?.addEventListener("click", () => {
            history.pushState({}, "", "/admin/add");
            render();
        });
    });

    document.querySelectorAll("[data-admin-edit]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const slug = button.dataset.adminEdit;
                const product = getProduct(slug);

                if (!product) return;

                history.pushState(
                    {},
                    "",
                    "/admin/edit/" + slug
                );

                render();
            });
        });

    document.querySelectorAll("[data-admin-delete]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const slug = button.dataset.adminDelete;
                const index =
                    PRODUCTS.findIndex(p => p.slug === slug);

                if (index === -1) return;

                PRODUCTS.splice(index, 1);

                showToast("Product removed");

                render();
            });
        });

    document.querySelector("#productAdminForm")
        ?.addEventListener("submit", event => {

            event.preventDefault();

            const slug =
                document.querySelector("#adminProductSlug").value;

            const productData = {
                slug: slug ||
                    document.querySelector("#adminProductName")
                        .value
                        .toLowerCase()
                        .trim()
                        .replace(/[^a-z0-9]+/g, "-"),

                name:
                    document.querySelector("#adminProductName").value,

                category:
                    document.querySelector("#adminProductCategory").value,

                price:
                    Number(document.querySelector("#adminProductPrice").value),

                mrp:
                    Number(document.querySelector("#adminProductMrp").value),

                img:
                    document.querySelector("#adminProductImage").value,

                description:
                    document.querySelector("#adminProductDescription").value,

                material: "925 Sterling Silver",

                details: [
                    "Premium 925 sterling silver",
                    "Anti-tarnish finish"
                ],

                sizes: ["One size"]
            };

            const existingIndex =
                PRODUCTS.findIndex(p => p.slug === slug);

            if (existingIndex >= 0) {
                PRODUCTS[existingIndex] = {
                    ...PRODUCTS[existingIndex],
                    ...productData
                };
                showToast("Product updated");
            } else {
                PRODUCTS.push(productData);
                showToast("Product added");
            }

            setTimeout(() => {
                history.pushState({}, "", "/admin");
                render();
            }, 400);
        });
}

/*
    NETLIFY ROUTING NOTE
    ---------------------
    The JavaScript handles /admin, /login, /signup, etc.
    inside the browser.

    A direct visit to /admin also needs Netlify's SPA fallback.
    That fallback is provided by the _redirects file included
    beside this index.html.
*/

/* ---------- Final feature-aware route rendering ---------- */

const baseRender = render;

render = function () {

    const path =
        location.pathname.replace(/\/$/, "") || "/";

    let content;

    if (path === "/login") {
        content = authPage("login");
    }
    else if (path === "/signup") {
        content = authPage("signup");
    }
    else if (path === "/account") {
        content = accountPage();
    }
    else if (path === "/admin") {
        content = adminPage();
    }
    else if (path === "/admin/add") {
        content = isAdmin()
            ? adminForm()
            : adminPage();
    }
    else if (path.startsWith("/admin/edit/")) {

        const slug = path.split("/")[3];
        const product = getProduct(slug);

        content = isAdmin() && product
            ? adminForm(product)
            : adminPage();
    }
    else {

        /* Use the original site's existing renderer
           for all normal store pages. */
        baseRender();
        return;
    }

    $("#app").innerHTML =
        header() +
        content +
        footer();

    updateBadge();
    bind();

    /* Feature-specific event binding */
    bindAuth(
        path === "/signup"
            ? "signup"
            : "login"
    );

    bindAdmin();

    document.querySelector("#logoutButton")
        ?.addEventListener("click", logoutUser);

    document.querySelector("#searchButton")
        ?.addEventListener("click", openSearch);

    window.scrollTo(0, 0);
};

/* ---------- Patch normal pages with search button ---------- */

bind = function () {

    originalBind();

    document.querySelector("#searchButton")
        ?.addEventListener("click", openSearch);

    document.querySelectorAll("a[href^='/']")
        .forEach(a => {

            if (a.dataset.bound) return;

            a.dataset.bound = "true";

            a.addEventListener("click", event => {

                event.preventDefault();

                history.pushState(
                    {},
                    "",
                    a.getAttribute("href")
                );

                menuOpen = false;

                render();
            });
        });
};

/* ---------- Keyboard shortcut: press "/" to search ---------- */

document.addEventListener("keydown", event => {

    const tag = document.activeElement?.tagName;

    if (
        event.key === "/" &&
        tag !== "INPUT" &&
        tag !== "TEXTAREA"
    ) {
        event.preventDefault();
        openSearch();
    }

    if (event.key === "Escape") {
        closeSearch();
    }
});

/* ---------- Product filtering + sorting ---------- */

function filteredProducts(
    category,
    searchQuery = "",
    sort = "featured",
    stockFilter = "all"
) {
    let list = [...PRODUCTS];

    if (category) {
        list = list.filter(
            product => product.category === category
        );
    }

    if (searchQuery) {
        const query = searchQuery.toLowerCase();

        list = list.filter(product =>
            product.name.toLowerCase().includes(query) ||
            product.category.toLowerCase().includes(query) ||
            product.material.toLowerCase().includes(query)
        );
    }

    /*
        Stock is demo-only right now. We give each product a
        temporary stock number so the frontend can demonstrate
        the inventory UI before a real database is connected.
    */

    if (stockFilter === "available") {
        list = list.filter(product =>
            demoStock(product.slug) > 0
        );
    }

    if (stockFilter === "low") {
        list = list.filter(product =>
            demoStock(product.slug) > 0 &&
            demoStock(product.slug) <= 5
        );
    }

    if (sort === "price-low") {
        list.sort((a, b) => a.price - b.price);
    }

    if (sort === "price-high") {
        list.sort((a, b) => b.price - a.price);
    }

    if (sort === "name") {
        list.sort((a, b) =>
            a.name.localeCompare(b.name)
        );
    }

    if (sort === "discount") {
        list.sort((a, b) =>
            save(b) - save(a)
        );
    }

    return list;
}

function demoStock(slug) {
    /*
        Deterministic demo stock.
        This is intentionally NOT real inventory.
    */

    const product = getProduct(slug);

    if (!product) return 0;

    return 3 + (
        product.slug.length * 7
    ) % 15;
}

function openCartDrawer() {
    let drawer = document.querySelector("#cartDrawer");

    if (!drawer) {
        document.body.insertAdjacentHTML(
            "beforeend",
            cartDrawer()
        );

        drawer = document.querySelector("#cartDrawer");
        bindCartDrawer();
    }

    drawer.classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeCartDrawer() {
    document.querySelector("#cartDrawer")
        ?.classList.remove("open");

    document.body.style.overflow = "";
}

function bindCartDrawer() {
    document.querySelector("#closeCartDrawer")
        ?.addEventListener("click", closeCartDrawer);

    document.querySelector("#cartDrawerBackdrop")
        ?.addEventListener("click", closeCartDrawer);

    document.querySelectorAll("[data-drawer-minus]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const [slug, size] =
                    button.dataset.drawerMinus.split("|");

                const item =
                    cart.find(
                        x =>
                            x.slug === slug &&
                            x.size === size
                    );

                setQty(
                    slug,
                    size,
                    (item?.qty || 1) - 1
                );

                refreshCartDrawer();
            });
        });

    document.querySelectorAll("[data-drawer-plus]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const [slug, size] =
                    button.dataset.drawerPlus.split("|");

                const item =
                    cart.find(
                        x =>
                            x.slug === slug &&
                            x.size === size
                    );

                setQty(
                    slug,
                    size,
                    (item?.qty || 0) + 1
                );

                refreshCartDrawer();
            });
        });
}

function refreshCartDrawer() {
    const old = document.querySelector("#cartDrawer");

    if (!old) return;

    const wasOpen = old.classList.contains("open");

    old.outerHTML = cartDrawer();

    if (wasOpen) {
        document.querySelector("#cartDrawer")
            ?.classList.add("open");
    }

    bindCartDrawer();
    updateBadge();
}

/* ---------- Frontend v2 event binding ---------- */

function bindFrontendV2() {

    /* Wishlist buttons */
    document
        .querySelectorAll("[data-wishlist]")
        .forEach(button => {

            button.addEventListener("click", event => {

                event.preventDefault();
                event.stopPropagation();

                toggleWishlist(
                    button.dataset.wishlist
                );
            });
        });

    /* Search button */
    document
        .querySelector("#searchButton")
        ?.addEventListener("click", openSearch);

    /* Cart icon opens drawer instead of immediately navigating */
    const cartButtons =
        document.querySelectorAll(
            '.actions a[href="/cart"]'
        );

    cartButtons.forEach(button => {

        button.addEventListener("click", event => {

            event.preventDefault();
            openCartDrawer();
        });
    });

    /* Product gallery */
    document
        .querySelectorAll("[data-gallery-image]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const index =
                    Number(button.dataset.galleryImage);

                const product =
                    getProduct(
                        location.pathname.split("/")[2]
                    );

                if (!product) return;

                const images =
                    productImages(product);

                const main =
                    document.querySelector(
                        "#mainProductImage"
                    );

                if (main) {
                    main.src = images[index];
                }

                document
                    .querySelectorAll(".gallery-thumb")
                    .forEach(thumb =>
                        thumb.classList.remove("active")
                    );

                button.classList.add("active");
            });
        });

    /* Buy now */
    document
        .querySelector("#buyNowBtn")
        ?.addEventListener("click", () => {

            const product =
                getProduct(
                    location.pathname.split("/")[2]
                );

            if (!product) return;

            const size =
                document.querySelector(
                    ".size.selected"
                )?.dataset.size ||
                product.sizes[0];

            addCart(product.slug, size);

            history.pushState(
                {},
                "",
                "/checkout"
            );

            render();
        });

    /* Filter drawer */
    document
        .querySelector("#filterToggle")
        ?.addEventListener("click", () => {

            document
                .querySelector("#filterDrawer")
                ?.classList.toggle("open");
        });

    /* Shop filtering */
    const shopRoot =
        document.querySelector("#shopProducts");

    if (shopRoot) {

        let selectedCategory = "all";
        let selectedStock = "all";
        let selectedSort = "featured";

        function refreshShop() {

            const list =
                filteredProducts(
                    selectedCategory === "all"
                        ? null
                        : selectedCategory,
                    "",
                    selectedSort,
                    selectedStock
                );

            shopRoot.innerHTML =
                list.map(card).join("");

            const count =
                document.querySelector("#shopCount");

            if (count) {
                count.textContent =
                    `${list.length} PRODUCTS`;
            }

            bindFrontendV2();
            bindInternalLinks();
        }

        document
            .querySelectorAll("[data-category-filter]")
            .forEach(button => {

                button.addEventListener("click", () => {

                    selectedCategory =
                        button.dataset.categoryFilter;

                    document
                        .querySelectorAll(
                            "[data-category-filter]"
                        )
                        .forEach(item =>
                            item.classList.remove("active")
                        );

                    button.classList.add("active");

                    refreshShop();
                });
            });

        document
            .querySelectorAll("[data-stock-filter]")
            .forEach(button => {

                button.addEventListener("click", () => {

                    selectedStock =
                        button.dataset.stockFilter;

                    document
                        .querySelectorAll(
                            "[data-stock-filter]"
                        )
                        .forEach(item =>
                            item.classList.remove("active")
                        );

                    button.classList.add("active");

                    refreshShop();
                });
            });

        document
            .querySelector("#sortProducts")
            ?.addEventListener("change", event => {

                selectedSort =
                    event.target.value;

                refreshShop();
            });
    }

    /* Checkout form */
    document
        .querySelector("#checkoutForm")
        ?.addEventListener("submit", event => {

            event.preventDefault();

            const order =
                createDemoOrder();

            if (!order) {
                showToast(
                    "Your cart is empty"
                );

                return;
            }

            cart = [];
            persist();

            history.pushState(
                {},
                "",
                "/order/" + order.id
            );

            render();

            showToast(
                "Demo order placed successfully"
            );
        });

    /* Account logout */
    document
        .querySelector("#accountLogout")
        ?.addEventListener("click", logoutUser);
}

/* ---------- Patch the final render so V2 routes are included ---------- */

const previousV2Render = render;

render = function () {

    const path =
        location.pathname.replace(/\/$/, "") || "/";

    let content = null;

    if (path === "/wishlist") {
        content = wishlistPage();
    }
    else if (path === "/checkout") {
        content = checkoutPage();
    }
    else if (path === "/orders") {
        content = ordersPage();
    }
    else if (path.startsWith("/order/")) {

        const id =
            path.split("/")[2];

        const order =
            demoOrders.find(
                item => item.id === id
            );

        content =
            order
                ? orderDetailPage(order)
                : notFound();
    }

    /*
        Normal routes continue through the previous renderer.
    */
    if (content === null) {
        previousV2Render();
        return;
    }

    $("#app").innerHTML =
        header() +
        content +
        footer();

    updateBadge();
    bind();
    bindFrontendV2();
    bindInternalLinks();

    window.scrollTo(0, 0);
};

/* ---------- Final frontend initialization ---------- */

setTimeout(() => {

    bindFrontendV2();

}, 50);


/* =========================================================
   START THE WEBSITE
   This is intentionally the LAST executable initialization.
   All V2 routes, wishlist, checkout, orders and handlers have
   been declared before the first render occurs.
   ========================================================= */

render();


    </script>
